# --- DataSource ---
spring.datasource.url=jdbc:h2:file:./data/gateway-db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# --- H2 Console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# --- Vision ---
vision.baseUrl=http://localhost:8081
vision.timeoutMillis=50000

# --- Data Lake ---
datalake.root=../datalake
datalake.pipelineScript=../scripts/build_datalake.py

# --- OpenAI ---
spring.config.import=optional:file:../.env[.properties]
openai.apiKey=${OPENAI_API_KEY:}
openai.baseUrl=https://api.openai.com/v1
openai.model=gpt-5.4-mini
openai.timeoutMillis=30000

# --- Upload ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# --- CORS ---
cors.allowed-origins=http://localhost:5173,http://192.168.15.8:5173

# --- Twilio SMS ---
twilio.enabled=${TWILIO_ENABLED:false}
twilio.accountSid=${TWILIO_ACCOUNT_SID:}
twilio.authToken=${TWILIO_AUTH_TOKEN:}
twilio.fromNumber=${TWILIO_FROM_NUMBER:}
twilio.timeoutMillis=${TWILIO_TIMEOUT_MS:15000}
